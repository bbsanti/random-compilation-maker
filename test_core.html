<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>core.js self-test</title>
<link rel="stylesheet" href="style.css">
<style>
  main { padding-top: 1.5rem; }
  .case { font-family: var(--mono); font-size: .82rem; padding: .15rem 0; }
  .pass { color: var(--ok); }
  .fail { color: var(--bad); }
  .verdict { font-size: 1.1rem; font-weight: 700; padding: .6rem .8rem; border-radius: 6px; margin: 0 0 1rem; }
  .verdict.pass { background: var(--ok-bg); }
  .verdict.fail { background: var(--bad-bg); }
  details { margin-top: .5rem; }
</style>
</head>
<body>
<main>
  <h1>core.js self-test</h1>
  <p class="dim small">
    Checks the browser port against ground truth generated by running the original
    <code>random_compilation_maker.py</code> functions (see <code>tests/gen_fixtures.py</code>), plus
    standalone checks for the parts the desktop version delegates to ffprobe.
  </p>
  <p id="verdict" class="verdict">running…</p>
  <div id="failures"></div>
  <details><summary>All checks</summary><div id="results"></div></details>
</main>

<script src="core.js"></script>
<script src="tests/fixtures.js"></script>
<script>
(function () {
  'use strict';
  var C = window.RCM;
  var F = window.RCM_FIXTURES;
  var pass = 0, fail = 0;
  var rows = [], fails = [];

  function record(ok, label, detail) {
    if (ok) { pass++; } else { fail++; fails.push(label + '\n    ' + (detail || '')); }
    rows.push('<div class="case ' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'ok   ' : 'FAIL ') + label +
      (ok ? '' : '  --  ' + (detail || '')) + '</div>');
  }

  function eq(actual, expected, label) {
    var a = JSON.stringify(actual), b = JSON.stringify(expected);
    record(a === b, label, a === b ? '' : 'got ' + a + ' want ' + b);
  }

  // ---------------------------------------------------------------- python parity
  F.cases.forEach(function (c, ci) {
    var tag = 'case' + ci + ' [' + c.res[0] + 'x' + c.res[1] + '@' + c.fps + ' rep' + c.rep + ' ' + c.scale_mode + ']';
    var target = C.buildTarget(c.res, c.fps, c.fps_frac, F.sources[c.rep], c.scale_mode);
    eq(target, c.target, tag + ' buildTarget');
    c.per_source.forEach(function (ps, si) {
      var s = F.sources[si];
      eq(C.mismatchReasons(s, target), ps.reasons, tag + ' mismatchReasons ' + s.path);
      eq(C.buildConformFilters(s, target), ps.filters, tag + ' conformFilters ' + s.path);
    });
  });

  F.encode.forEach(function (e) {
    var got = C.buildVideoEncodeArgs(F.sources[e.rep], null);
    eq(got.args, e.args, 'encodeArgs ' + e.path);
    eq(got.name, e.name, 'encoderName ' + e.path);
    eq(got.interlaced, e.interlaced, 'interlaced ' + e.path);
    eq(got.encoder, e.encoder, 'encoder ' + e.path);
    eq(got.container, e.container, 'container ' + e.path);
  });

  // Every codec/profile combination the tables know about, held to exactly the
  // arguments the desktop tool emits.
  F.profile_encode.forEach(function (e) {
    var got = C.buildVideoEncodeArgs(F.profile_sources[e.rep], null);
    eq(got.args, e.args, 'profile args ' + e.path);
    eq(got.name, e.name, 'profile name ' + e.path);
    eq(got.encoder, e.encoder, 'profile encoder ' + e.path);
    eq(got.container, e.container, 'profile container ' + e.path);
    eq(got.interlaced, e.interlaced, 'profile interlaced ' + e.path);
  });

  eq(C.distinctResolutions(F.sources).map(function (r) { return [r.res, r.count]; }),
     F.groups.resolutions, 'distinctResolutions');
  eq(C.distinctFps(F.sources).map(function (f) { return [f.key, f.count, f.display]; }),
     F.groups.fps, 'distinctFps');
  eq(C.distinctCodecs(F.sources).map(function (c) { return [C.describeCodecSig(c.sig), c.count]; }),
     F.groups.codecs, 'distinctCodecs');

  F.misc.format_fps.forEach(function (p) { eq(C.formatFps(p[0]), p[1], 'formatFps(' + p[0] + ')'); });
  F.misc.fps_key.forEach(function (p) { eq(C.fpsKey(p[0]), p[1], 'fpsKey(' + p[0] + ')'); });
  F.misc.double_fraction.forEach(function (p) {
    eq(C.doubleFraction(p[0]), p[1], 'doubleFraction("' + p[0] + '")');
  });
  F.misc.describe_codec_sig.forEach(function (p) {
    eq(C.describeCodecSig(p[0]), p[1], 'describeCodecSig(' + JSON.stringify(p[0]) + ')');
  });

  // ------------------------------------------------------- probe-log parsing
  var BANNERS = [
    {
      name: 'h264 progressive mp4',
      path: '/in/src_0001.mp4',
      log: [
        "Input #0, mov,mp4,m4a,3gp,3g2,mj2, from '/in/src_0001.mp4':",
        '  Metadata:',
        '    major_brand     : isom',
        '  Duration: 00:01:23.45, start: 0.000000, bitrate: 1105 kb/s',
        '  Stream #0:0[0x1](und): Video: h264 (High) (avc1 / 0x31637661), yuv420p(tv, bt709, progressive), 1920x1080 [SAR 1:1 DAR 16:9], 1103 kb/s, 29.97 fps, 29.97 tbr, 30k tbn (default)',
        '  Stream #0:1[0x2](und): Audio: aac (LC) (mp4a / 0x6134706D), 48000 Hz, stereo, fltp, 128 kb/s (default)'
      ],
      want: {
        duration: 83.45, width: 1920, height: 1080, codec: 'h264', profile: 'High',
        pix_fmt: 'yuv420p', field_order: 'progressive', ext: '.mp4',
        fps_key: 29.97, fps_frac: '30000/1001', bit_rate: '1103000'
      }
    },
    {
      name: 'mpeg2 interlaced top-first',
      path: '/in/src_0002.mpg',
      log: [
        "Input #0, mpeg, from '/in/src_0002.mpg':",
        '  Duration: 00:00:30.03, start: 0.500000, bitrate: 6000 kb/s',
        '  Stream #0:0[0x1e0]: Video: mpeg2video (Main), yuv420p(tv, top first), 720x480 [SAR 8:9 DAR 4:3], 6000 kb/s, 29.97 fps, 29.97 tbr, 90k tbn'
      ],
      want: {
        duration: 30.03, width: 720, height: 480, codec: 'mpeg2video', profile: 'Main',
        pix_fmt: 'yuv420p', field_order: 'tt', ext: '.mpg',
        fps_key: 29.97, fps_frac: '30000/1001', bit_rate: '6000000'
      }
    },
    {
      name: 'prores hq mov',
      path: '/in/src_0003.mov',
      log: [
        "Input #0, mov,mp4,m4a,3gp,3g2,mj2, from '/in/src_0003.mov':",
        '  Duration: 00:00:12.00, start: 0.000000, bitrate: 176175 kb/s',
        '  Stream #0:0[0x1](eng): Video: prores (HQ) (apch / 0x68637061), yuv422p10le(bt709/bt709/iec61966-2-1, progressive), 1920x1080, 176175 kb/s, 25 fps, 25 tbr, 25k tbn (default)'
      ],
      want: {
        duration: 12, width: 1920, height: 1080, codec: 'prores', profile: 'HQ',
        pix_fmt: 'yuv422p10le', field_order: 'progressive', ext: '.mov',
        fps_key: 25, fps_frac: '25/1', bit_rate: '176175000'
      }
    },
    {
      name: 'dv bottom-first, no stream bitrate',
      path: '/in/src_0004.dv',
      log: [
        "Input #0, dv, from '/in/src_0004.dv':",
        '  Duration: 00:00:05.00, start: 0.000000, bitrate: 28800 kb/s',
        '  Stream #0:0: Video: dvvideo, yuv420p(bottom first), 720x576 [SAR 16:15 DAR 4:3], 25 fps, 25 tbr, 25 tbn'
      ],
      want: {
        duration: 5, width: 720, height: 576, codec: 'dvvideo', profile: null,
        pix_fmt: 'yuv420p', field_order: 'bb', ext: '.dv',
        fps_key: 25, fps_frac: '25/1', bit_rate: '28800000'
      }
    },
    {
      name: 'no profile, fourcc only, 23.976',
      path: '/in/src_0005.mkv',
      log: [
        "Input #0, matroska,webm, from '/in/src_0005.mkv':",
        '  Duration: 00:02:00.10, start: 0.000000, bitrate: 3000 kb/s',
        '  Stream #0:0: Video: hevc (Main 10), yuv420p10le(tv, bt2020nc/bt2020/smpte2084), 3840x2160, 23.98 fps, 23.98 tbr, 1k tbn'
      ],
      want: {
        duration: 120.1, width: 3840, height: 2160, codec: 'hevc', profile: 'Main 10',
        pix_fmt: 'yuv420p10le', field_order: 'unknown', ext: '.mkv',
        fps_key: 23.98, fps_frac: '24000/1001', bit_rate: '3000000'
      }
    }
  ];

  BANNERS.forEach(function (b) {
    var got = C.parseProbeLog(b.log, b.path);
    if (!got) { record(false, 'parseProbeLog ' + b.name, 'returned null'); return; }
    Object.keys(b.want).forEach(function (k) {
      eq(got[k], b.want[k], 'parseProbeLog ' + b.name + '.' + k);
    });
  });

  record(C.parseProbeLog(['Input #0, foo', '  Duration: 00:00:10.00, bitrate: 1 kb/s',
    '  Stream #0:0: Audio: aac, 48000 Hz'], 'a.m4a') === null,
    'parseProbeLog rejects audio-only', 'should be null');
  record(C.parseProbeLog(['nonsense'], 'x.mp4') === null, 'parseProbeLog rejects junk', 'should be null');
  record(C.parseProbeLog(['  Duration: N/A, bitrate: N/A',
    '  Stream #0:0: Video: h264, yuv420p, 320x240, 25 fps'], 'x.mp4') === null,
    'parseProbeLog rejects unknown duration', 'should be null');

  // ------------------------------------------------------------- fpsFraction
  [[29.97, '30000/1001'], [23.98, '24000/1001'], [23.976, '24000/1001'], [59.94, '60000/1001'],
   [119.88, '120000/1001'], [24, '24/1'], [25, '25/1'], [30, '30/1'], [60, '60/1'],
   [12.5, '12500/1000']].forEach(function (p) {
    eq(C.fpsFraction(p[0]), p[1], 'fpsFraction(' + p[0] + ')');
  });

  // Nearest wins, not first-within-tolerance: concatenated output often reads
  // back as 29.99, which is 30 fps, not 29.97.
  [[29.99, '30/1'], [30.0, '30/1'], [29.97, '30000/1001'], [29.96, '30000/1001'],
   [23.98, '24000/1001'], [59.95, '60000/1001'], [24.01, '24/1']].forEach(function (p) {
    var got = C.snapFps(p[0], 0.012);
    eq(got && got.frac, p[1], 'snapFps(' + p[0] + ')');
  });
  eq(C.snapFps(28, 0.012), null, 'snapFps leaves a non-standard rate alone');
  eq(C.snapFps(12.5, 0.012), null, 'snapFps leaves 12.5 alone');

  var nearly30 = C.parseProbeLog([
    '  Duration: 00:00:06.00, start: 0.000000, bitrate: 588 kb/s',
    '  Stream #0:0[0x1](und): Video: h264 (High) (avc1 / 0x31637661), yuv420p(progressive), 320x240 [SAR 1:1 DAR 4:3], 584 kb/s, 29.99 fps, 30 tbr, 15360 tbn (default)'
  ], 'out.mp4');
  eq(nearly30 && nearly30.fps_key, 30, 'a 29.99 fps banner is read as 30 fps');
  eq(nearly30 && nearly30.fps_frac, '30/1', 'a 29.99 fps banner gets the 30/1 fraction');

  // --------------------------------------------------------------- splitting
  eq(C.splitTopLevel('a (b, c), d [e, f], g', ','), ['a (b, c)', 'd [e, f]', 'g'], 'splitTopLevel');

  // ------------------------------------------------- predicting the container
  // A save location picked before the render cannot be renamed afterwards, so
  // the extension has to be right from the source names alone.
  eq(C.guessOutputContainer(['a.mov', 'b.mov', 'c.mp4']), '.mov', 'guessOutputContainer picks the commonest');
  eq(C.guessOutputContainer(['reel.MOV']), '.mov', 'guessOutputContainer lowercases');
  eq(C.guessOutputContainer(['sub/dir/clip.mxf', 'sub/dir/clip2.mxf']), '.mxf',
    'guessOutputContainer handles paths');
  eq(C.guessOutputContainer(['a.mp4', 'b.mov']), '.mov', 'guessOutputContainer breaks ties predictably');
  eq(C.guessOutputContainer(['notes.txt', 'sheet.csv']), null, 'guessOutputContainer ignores non-video');
  eq(C.guessOutputContainer([]), null, 'guessOutputContainer copes with nothing');
  eq(C.guessOutputContainer(undefined), null, 'guessOutputContainer copes with undefined');

  eq(C.withExtension('random_compilation.mp4', '.mov'), 'random_compilation.mov', 'withExtension swaps');
  eq(C.withExtension('my.reel.v2.mp4', '.mov'), 'my.reel.v2.mov', 'withExtension keeps inner dots');
  eq(C.withExtension('noextension', '.mov'), 'noextension.mov', 'withExtension appends');
  eq(C.withExtension('', '.mov'), 'random_compilation.mov', 'withExtension has a default stem');

  // ------------------------------------------- output size pre-flight (web only)
  // A browser tab holds the whole compilation in RAM, so an over-large render
  // has to be refused up front instead of dying on
  // "RangeError: Array buffer allocation failed" twenty minutes in.
  eq(C.estimateOutputBytes('8000000', 90), 90 * 1e6, 'estimateOutputBytes from bits per second');
  eq(C.estimateOutputBytes(null, 90), null, 'estimateOutputBytes needs a bit rate');
  eq(C.estimateOutputBytes('0', 90), null, 'estimateOutputBytes rejects a zero bit rate');
  eq(C.estimateOutputBytes('8000000', 0), null, 'estimateOutputBytes needs a duration');
  eq(C.outputSizeVerdict(null), 'unknown', 'an unknown size is not judged');
  eq(C.outputSizeVerdict(50 * 1024 * 1024), 'ok', 'a small output is fine');
  eq(C.outputSizeVerdict(C.SOFT_OUTPUT_LIMIT + 1), 'large', 'past the soft limit is large');
  eq(C.outputSizeVerdict(C.HARD_OUTPUT_LIMIT + 1), 'too-big', 'past the hard limit is refused');

  // ProRes HQ 1080p is ~176 Mbit/s. This is the case that actually blew up:
  // 90 seconds of it is about 2 GB, and the tab cannot hold that.
  var proresHQ = '176000000';
  var ninety = C.estimateOutputBytes(proresHQ, 90);
  record(ninety > 1.9e9 && C.outputSizeVerdict(ninety) === 'too-big',
    '90s of ProRes HQ 1080p is refused up front', C.formatBytes(ninety));
  var fits = C.maxSecondsAtBitRate(proresHQ);
  record(fits >= 12 && fits <= 16, 'and it suggests a duration that comfortably fits', fits + 's');
  eq(C.outputSizeVerdict(C.estimateOutputBytes(proresHQ, fits)), 'ok',
    'the suggested duration really is under the limit');

  // H.264 at a normal bit rate is nowhere near the ceiling.
  eq(C.outputSizeVerdict(C.estimateOutputBytes('8000000', 90)), 'ok',
    '90s of 8 Mbit/s H.264 is fine');
  eq(C.maxSecondsAtBitRate(null), null, 'maxSecondsAtBitRate needs a bit rate');

  // ------------------------------------------ smaller alternatives that do fit
  // Measured on grain-heavy 1080p25 ProRes: HQ 193, Standard 128, LT 89,
  // Proxy 40 Mbit/s. 90 seconds of HQ is ~2 GB and cannot be done in a tab, so
  // the app has to offer something that can.
  var hq1080 = {
    codec: 'prores', profile: 'HQ', width: 1920, height: 1080,
    bit_rate: '193000000', pix_fmt: 'yuv422p10le', ext: '.mov'
  };
  var opts90 = C.fitOptions(hq1080, 90, C.HARD_OUTPUT_LIMIT);
  record(opts90.length === 2, '90s of ProRes HQ 1080p offers exactly two ways out',
    opts90.map(function (o) { return o.label; }).join(' | '));
  eq(opts90[0].apply, { profile: 'Proxy' }, 'ProRes Proxy comes first, keeping the full length');
  record(opts90[1].apply.seconds !== undefined, 'a shorter video is the other option',
    opts90[1].label);
  record(opts90.every(function (o) { return o.estBytes <= C.HARD_OUTPUT_LIMIT; }),
    'both alternatives are under the limit',
    opts90.map(function (o) { return C.formatBytes(o.estBytes); }).join(', '));

  // Resolution is never touched: handing back a smaller picture than the
  // sources is not an acceptable substitution.
  record(!opts90.some(function (o) {
    return o.apply.width !== undefined || o.apply.height !== undefined;
  }), 'the frame size is never offered as a way to save space');
  record(!/\d+ ?x ?\d+/.test(opts90.map(function (o) { return o.label + o.detail; }).join(' ')),
    'and no option even mentions a frame size',
    opts90.map(function (o) { return o.label; }).join(' | '));

  // Never anything heavier than the source, and never a pointless no-op.
  record(!opts90.some(function (o) {
    return o.apply.profile && C.proresRatio(o.apply.profile) >= C.proresRatio('HQ');
  }), 'no alternative is heavier than the source profile');
  var proxySrc = { codec: 'prores', profile: 'Proxy', width: 1920, height: 1080,
    bit_rate: '40000000' };
  record(!C.fitOptions(proxySrc, 600, C.HARD_OUTPUT_LIMIT).some(function (o) {
    return o.apply.profile;
  }), 'a Proxy source is not offered Proxy again',
    C.fitOptions(proxySrc, 600, C.HARD_OUTPUT_LIMIT).map(function (o) { return o.label; }).join(' | '));

  // Ratios must match what was measured.
  record(Math.abs(C.proresRatio('Proxy') - 0.21) < 0.01 &&
    Math.abs(C.proresRatio('LT') - 0.46) < 0.01 &&
    C.proresRatio('HQ') === 1, 'ProRes rate ratios match the measured values');
  eq(C.proresRatio('nonsense'), null, 'an unknown profile has no ratio');

  // A non-ProRes source has no Proxy to fall back on -- only length.
  var h264opts = C.fitOptions({ codec: 'h264', profile: 'High', width: 1920, height: 1080,
    bit_rate: '400000000' }, 90, C.HARD_OUTPUT_LIMIT);
  record(h264opts.length === 1 && h264opts[0].apply.seconds !== undefined,
    'an H.264 source is only offered a shorter video',
    h264opts.map(function (o) { return o.label; }).join(' | '));

  // Even Proxy cannot rescue an absurd request, and then only length is left.
  var huge = C.fitOptions(hq1080, 3600, C.HARD_OUTPUT_LIMIT);
  record(huge.length === 1 && huge[0].apply.seconds !== undefined,
    'when Proxy would still be too big, only shortening is offered',
    huge.map(function (o) { return o.label; }).join(' | '));

  eq(C.fitOptions({ codec: 'prores', profile: 'HQ', width: 1920, height: 1080, bit_rate: null },
    90, C.HARD_OUTPUT_LIMIT), [], 'no bit rate means no advice');

  // ------------------------------------------------------------ clip planning
  var planSources = [
    { path: '/in/a.mp4', duration: 60, vf: null },
    { path: '/in/b.mp4', duration: 10, vf: 'scale=2:2' },
    { path: '/in/c.mp4', duration: 0.5, vf: null }   // too short for min_len
  ];
  var baseOpts = { mode: 'count', clip_count: 25, total_duration: 0, min_len: 1, max_len: 3, shuffle: false };

  var plan = C.planClips(planSources, baseOpts, C.makeRng('seed-1'));
  eq(plan.length, 25, 'planClips count mode length');
  record(plan.every(function (c) { return c.length >= 1 - 1e-9 && c.length <= 3 + 1e-9; }),
    'planClips respects min/max length', JSON.stringify(plan.slice(0, 3)));
  record(plan.every(function (c) {
    var src = planSources.filter(function (s) { return s.path === c.path; })[0];
    return src && c.start >= 0 && c.start + c.length <= src.duration + 1e-6;
  }), 'planClips stays inside each source', '');
  record(plan.every(function (c) { return c.path !== '/in/c.mp4'; }),
    'planClips skips sources shorter than min_len', '');
  record(plan.some(function (c) { return c.vf === 'scale=2:2'; }),
    'planClips carries the per-source conform filter', '');

  var again = C.planClips(planSources, baseOpts, C.makeRng('seed-1'));
  eq(again, plan, 'planClips is reproducible for one seed');
  var other = C.planClips(planSources, baseOpts, C.makeRng('seed-2'));
  record(JSON.stringify(other) !== JSON.stringify(plan), 'a different seed gives a different plan', '');

  var durOpts = { mode: 'duration', clip_count: 0, total_duration: 30, min_len: 1, max_len: 3, shuffle: false };
  var durPlan = C.planClips(planSources, durOpts, C.makeRng('seed-3'));
  var totalLen = durPlan.reduce(function (a, c) { return a + c.length; }, 0);
  record(Math.abs(totalLen - 30) < 0.01, 'planClips duration mode hits the target',
    'total ' + totalLen);
  record(durPlan.every(function (c) { return c.length > 0; }), 'planClips emits no zero-length clip', '');

  var shuffled = C.planClips(planSources, { mode: 'count', clip_count: 40, total_duration: 0,
    min_len: 1, max_len: 3, shuffle: true }, C.makeRng('seed-4'));
  eq(shuffled.length, 40, 'planClips shuffle keeps the clip count');

  try {
    C.planClips([{ path: 'x', duration: 0.2 }], baseOpts, C.makeRng('s'));
    record(false, 'planClips throws when nothing is long enough', 'no throw');
  } catch (e) {
    record(/long enough/.test(e.message), 'planClips throws when nothing is long enough', e.message);
  }

  // ------------------------------------------------------------ command lines
  var clip = { path: '/in/src_0001.mp4', start: 12.3456, length: 2.5, vf: 'scale=1920:1080' };
  var runOpts = { encode_args: ['-c:v', 'libx264', '-crf', '16'], fps_frac: '30000/1001' };
  eq(C.buildClipArgs(clip, runOpts, 'clip_00001.mp4'),
    ['-hide_banner', '-nostdin', '-y', '-ss', '12.346', '-i', '/in/src_0001.mp4', '-t', '2.500',
     '-map', '0:v:0', '-an', '-vf', 'scale=1920:1080', '-c:v', 'libx264', '-crf', '16',
     '-r', '30000/1001', '-fps_mode', 'cfr', 'clip_00001.mp4'],
    'buildClipArgs with filters');

  eq(C.buildClipArgs({ path: '/in/a.mp4', start: 0, length: 1, vf: null }, runOpts, 'o.mp4'),
    ['-hide_banner', '-nostdin', '-y', '-ss', '0.000', '-i', '/in/a.mp4', '-t', '1.000',
     '-map', '0:v:0', '-an', '-c:v', 'libx264', '-crf', '16',
     '-r', '30000/1001', '-fps_mode', 'cfr', 'o.mp4'],
    'buildClipArgs without filters');

  eq(C.buildConcatList(['/clip_1.mp4', "/it's.mp4"]),
    "file '/clip_1.mp4'\nfile '/it'\\''s.mp4'\n", 'buildConcatList escapes quotes');
  eq(C.buildConcatArgs('/concat_list.txt', 'out.mp4'),
    ['-hide_banner', '-nostdin', '-y', '-f', 'concat', '-safe', '0', '-i', '/concat_list.txt',
     '-c', 'copy', '-an', 'out.mp4'], 'buildConcatArgs');

  // ------------------------------------------------- profile fidelity spot checks
  function encOf(path) {
    for (var i = 0; i < F.profile_sources.length; i++) {
      if (F.profile_sources[i].path === path) return C.buildVideoEncodeArgs(F.profile_sources[i], null);
    }
    throw new Error('no fixture ' + path);
  }
  // The bug that started this: ffprobe calls ProRes 4444 XQ just "XQ", so a
  // substring cascade fell through to profile 2 (Standard).
  record(encOf('pr_xq.mov').args.join(' ').indexOf('-profile:v 5') >= 0,
    'ProRes XQ encodes as XQ, not Standard', encOf('pr_xq.mov').args.join(' '));
  record(encOf('pr_lt.mov').args.join(' ').indexOf('-profile:v 1') >= 0,
    'ProRes LT encodes as ProRes LT', encOf('pr_lt.mov').args.join(' '));
  eq(encOf('pr_in_mp4.mp4').container, '.mov', 'ProRes is never written into .mp4');
  record(encOf('pr_4444.mov').args.indexOf('yuva444p10le') >= 0,
    'ProRes 4444 keeps its alpha plane', encOf('pr_4444.mov').args.join(' '));

  // These two used to fail the whole render with an incompatible pixel format.
  eq(encOf('dnxhr_hqx.mxf').args,
    ['-c:v', 'dnxhd', '-profile:v', 'dnxhr_hqx', '-pix_fmt', 'yuv422p10le'], 'DNxHR HQX encodes');
  eq(encOf('dnxhr_444.mxf').args,
    ['-c:v', 'dnxhd', '-profile:v', 'dnxhr_444', '-pix_fmt', 'yuv444p10le'], 'DNxHR 444 encodes');
  record(encOf('dnxhr_lb.mxf').args.join(' ').indexOf('dnxhr_lb') >= 0,
    'DNxHR LB stays LB instead of becoming HQ', encOf('dnxhr_lb.mxf').args.join(' '));
  record(encOf('dnxhr_hq.mxf').interlaced === false,
    'DNxHR never gets interlace flags (they are fatal)', '');

  record(encOf('h264_main.mp4').args.join(' ').indexOf('-profile:v main') >= 0,
    'H.264 Main stays Main instead of becoming High', '');
  record(encOf('h264_ilace_h362.mp4').args.join(' ').indexOf('interlaced=1') < 0,
    'H.264 drops interlacing when the height would kill x264', '');
  record(encOf('h264_floor.mp4').args.join(' ').indexOf('high422') >= 0,
    'the pixel format raises the H.264 profile ceiling', '');

  record(encOf('mj_ilace.mov').args.indexOf('+ilme+ildct') < 0 &&
    encOf('mj_ilace.mov').args.join(' ').indexOf('-field_order tt') >= 0,
    'interlaced MJPEG gets the field order but not the fatal flags', '');
  record(encOf('dv_resized.avi').encoder === 'libx264',
    'DV conformed away from a DV frame size falls back instead of failing', '');
  record(encOf('mp4v_studio.avi').args.join(' ').indexOf('-profile:v') < 0,
    'MPEG-4 Simple Studio omits the profile that writes a corrupt bitstream', '');

  // -------------------------------------------------- encoder fallback (web only)
  var avail = new Set(['libx264', 'mpeg4', 'mjpeg', 'mpeg2video']);
  var pro = C.buildVideoEncodeArgs(F.sources[3], avail);   // prores HQ .mov
  record(pro.fallback === true && pro.encoder === 'libx264', 'prores falls back to libx264', pro.encoder);
  eq(pro.wanted, 'prores_ks', 'fallback remembers the wanted encoder');
  eq(pro.container, '.mov', 'fallback keeps a container h264 can use');
  record(pro.args.indexOf('yuv422p10le') < 0 && pro.args.indexOf('yuv420p') >= 0,
    'fallback drops a pixel format x264 cannot take', pro.args.join(' '));

  var dv = C.buildVideoEncodeArgs(F.sources[9], avail);    // dvvideo .dv, bottom first
  eq(dv.container, '.mp4', 'fallback moves an unsuitable container to .mp4');
  record(dv.interlaced === true && dv.args.join(' ').indexOf('bff=1') >= 0,
    'fallback keeps the interlaced field order', dv.args.join(' '));

  var native = C.buildVideoEncodeArgs(F.sources[0], avail); // h264 -- already available
  record(native.fallback === false && native.encoder === 'libx264', 'no fallback when the encoder exists', '');

  // An encoder present in the build but known to be unusable is removed from
  // `available` by the app, so it takes the same fallback path.
  var noX265 = new Set(['libx264', 'prores_ks', 'dnxhd', 'mpeg2video', 'mjpeg', 'mpeg4']);
  var hv = C.buildVideoEncodeArgs(F.profile_sources.filter(function (s) {
    return s.path === 'hevc_m10.mkv';
  })[0], noX265);
  record(hv.fallback === true && hv.encoder === 'libx264',
    'HEVC falls back when libx265 is unusable', hv.encoder);
  eq(hv.wanted, 'libx265', 'the HEVC fallback remembers what it wanted');

  // ------------------------------------------------------------------ misc
  eq(C.parseFrameCount('frame=  142 fps= 24 q=28.0 size=  1024kB time=00:00:05.91'), 142, 'parseFrameCount');
  eq(C.parseFrameCount('no frames here'), null, 'parseFrameCount ignores other lines');
  eq(C.parseEncoderLine(' V....D prores_ks            Apple ProRes'), 'prores_ks', 'parseEncoderLine');
  eq(C.parseEncoderLine(' A....D aac                  AAC'), null, 'parseEncoderLine skips audio');
  eq(C.extOf('a/b/C.MP4'), '.mp4', 'extOf lowercases');
  eq(C.isVideoName('clip.MOV'), true, 'isVideoName');
  eq(C.isVideoName('notes.txt'), false, 'isVideoName rejects non-video');
  eq(C.sanitizeName('my compilation!.mp4'), 'my_compilation_.mp4', 'sanitizeName');
  eq(C.formatDuration(3725), '1:02:05', 'formatDuration');
  eq(C.formatBytes(1536), '1.50 KB', 'formatBytes');

  // ---------------------------------------------------------------- report
  document.getElementById('results').innerHTML = rows.join('');
  var v = document.getElementById('verdict');
  v.textContent = (fail === 0 ? 'PASS' : 'FAIL') + ' — ' + pass + ' passed, ' + fail + ' failed';
  v.className = 'verdict ' + (fail === 0 ? 'pass' : 'fail');
  document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' ' + pass + '/' + (pass + fail);
  if (fails.length) {
    document.getElementById('failures').innerHTML =
      '<pre class="log">' + fails.join('\n').replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</pre>';
  }
}());
</script>
</body>
</html>
